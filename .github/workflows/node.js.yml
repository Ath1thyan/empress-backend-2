# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [18.x]  # Use a stable LTS version if 22.x is causing issues

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'  # Specify dependency file for cache key

    - name: Install Dependencies
      run: npm ci --verbose  # Add --verbose to get more details in logs

    - name: Verify PM2 Installation
      run: pm2 --version  # Check PM2 installation

    - name: Create .env File
      run: |
        touch .env
        echo "${{ secrets.PROD }}" > .env
        cat .env  # Output .env content to check if it's populated correctly

    - name: List PM2 Processes
      run: pm2 list  # List running PM2 processes for debugging

    - name: Restart Backend API with PM2
      run: pm2 restart BackendAPI
